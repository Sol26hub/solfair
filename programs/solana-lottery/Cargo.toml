[package]
name = "solana-lottery"
version = "0.1.0"
description = "Decentralized on-chain lottery with Switchboard VRF"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_lottery"

[features]
no-entrypoint = []
no-idl = []
idl-build = ["anchor-lang/idl-build"]
no-log-ip = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"


